name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render (jarchiya)
        run: |
          echo "🔔 Pinging Render..."
          
          curl -X GET "https://jarchiya.onrender.com/api/health" \
               -H "Accept: application/json" \
               --max-time 90 \
               --retry 3 \
               --retry-delay 5 \
               --fail \
               --silent \
               --show-error
          
          if [ $? -eq 0 ]; then
            echo "✅ Server is alive!"
          else
            echo "❌ Connection failed"
            exit 1
          fi
