<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ربات‌های محتوا | جارچیا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Unbounded:wght@600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A16; --ink:#F3F1FB; --muted:#9795B3;
  --v:#8B7CFF; --p:#FF7CC0; --m:#6FF0C7; --gold:#F5C56B; --danger:#FF6B81;
  --line:rgba(255,255,255,.09); --glass:rgba(255,255,255,.045);
  --serif:'Vazirmatn',sans-serif; --display:'Unbounded',sans-serif; --mono:'JetBrains Mono',monospace;
}
body[data-mode="light"]{
  --bg:#F4F3FA; --glass:#FFFFFF; --line:#E7E5F3; --ink:#1B1B29; --muted:#6B6C82;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--ink); font-family:var(--serif); min-height:100vh;}
button,input,textarea,select{font-family:var(--serif); color:var(--ink);}
button{cursor:pointer;}
.container{max-width:1080px; margin:0 auto; padding:24px;}
.wordmark{font-family:var(--display); font-weight:800; font-size:18px; display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.wordmark .dot{width:8px; height:8px; border-radius:50%; background:linear-gradient(135deg,var(--v),var(--p));}
h1{font-size:22px; margin-bottom:6px;}
p.lead{color:var(--muted); font-size:14px; margin-bottom:24px;}
#statusBanner{padding:11px 16px; border-radius:12px; font-size:13px; margin-bottom:20px; display:none;}
#statusBanner.warn{display:block; background:rgba(255,197,107,.14); color:var(--gold);}
#statusBanner.err{display:block; background:rgba(255,107,129,.14); color:var(--danger);}

.layout{display:grid; grid-template-columns:280px 1fr; gap:20px; align-items:start;}
@media (max-width:860px){.layout{grid-template-columns:1fr;}}
.bot-list{display:flex; flex-direction:column; gap:6px; max-height:78vh; overflow-y:auto; padding-inline-end:6px;}
.bot-item{
  background:var(--glass); border:1px solid var(--line); border-radius:11px; padding:11px 13px;
  font-size:13px; cursor:pointer; transition:border-color .15s;
}
.bot-item:hover{border-color:var(--v);}
.bot-item.active{border-color:var(--v); background:rgba(139,124,255,.12);}

.panel{background:var(--glass); border:1px solid var(--line); border-radius:16px; padding:22px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; color:var(--muted); font-family:var(--mono); margin-bottom:8px;}
.field textarea{width:100%; min-height:100px; background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:11px; padding:12px 14px; font-size:14px; resize:vertical;}
.field textarea:focus{outline:none; border-color:var(--v);}
.btn{border:none; border-radius:11px; padding:12px 22px; font-weight:700; font-size:14px; background:linear-gradient(135deg,var(--v),var(--p)); color:#fff;}
.btn:disabled{opacity:.6; cursor:wait;}
.output-box{
  margin-top:18px; background:#08080F; border:1px solid var(--line); border-radius:12px; padding:16px;
  font-size:13.5px; line-height:1.9; white-space:pre-wrap; min-height:60px; color:var(--m);
}
.output-empty{color:var(--muted); font-style:normal;}
.copy-btn{margin-top:10px; background:var(--glass); border:1px solid var(--line); color:var(--ink); padding:8px 16px; border-radius:9px; font-size:12.5px;}
</style>
</head>
<body data-mode="dark">
<div class="container">
  <div style="display:flex; justify-content:space-between; align-items:flex-start;">
    <div class="wordmark"><span class="dot"></span>جارچیا</div>
    <div class="mode-toggle" style="display:flex; gap:4px; background:var(--glass); border:1px solid var(--line); border-radius:20px; padding:4px;">
      <button class="mode-btn" data-mode="light" style="padding:6px 11px; border:none; background:transparent; border-radius:16px; font-size:13px; color:var(--muted); cursor:pointer;">☀️</button>
      <button class="mode-btn active" data-mode="dark" style="padding:6px 11px; border:none; background:linear-gradient(135deg,var(--v),var(--p)); border-radius:16px; font-size:13px; color:#fff; cursor:pointer;">🌙</button>
    </div>
  </div>
  <h1>۲۰ ربات واقعی تولید محتوا</h1>
  <p class="lead">یک ربات انتخاب کن، موضوع رو بنویس، و خروجی واقعی هوش مصنوعی رو ببین.</p>

  <div id="statusBanner"></div>

  <div class="layout">
    <div class="bot-list" id="botList"></div>
    <div class="panel">
      <div class="field">
        <label id="selectedBotLabel">موضوع / ورودی برای: —</label>
        <textarea id="botInput" placeholder="مثلاً: کیف چرم دست‌دوز، رنگ قهوه‌ای، مناسب هدیه"></textarea>
      </div>
      <button class="btn" id="btnGenerate">تولید محتوای واقعی ✦</button>
      <div class="output-box" id="outputBox"><span class="output-empty">خروجی اینجا نمایش داده می‌شود...</span></div>
      <button class="copy-btn" id="btnCopy" style="display:none;">کپی خروجی</button>
    </div>
  </div>
</div>

<script>
const apiBase = (localStorage.getItem('jarchiya_api_base') || 'https://jarchiya-backend.onrender.com').replace(/\/$/,'');
const token = localStorage.getItem('jarchiya_token');
const statusBanner = document.getElementById('statusBanner');
let selectedBotId = null;

if(!token){
  statusBanner.className = 'warn';
  statusBanner.textContent = 'اول باید وارد حساب بشی. صفحه‌ی 7-auth-login.html رو باز کن.';
}

async function loadBots(){
  try{
    const res = await fetch(apiBase + '/api/bots', { headers:{ Authorization:'Bearer '+token } });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error);

    if(!data.configured){
      statusBanner.className = 'warn';
      statusBanner.textContent = '⚠ کلید ANTHROPIC_API_KEY هنوز روی سرور تنظیم نشده — لیست ربات‌ها دیده می‌شه ولی تولید محتوا کار نمی‌کنه تا اضافه‌ش کنی.';
    }

    const list = document.getElementById('botList');
    data.bots.forEach((b, i)=>{
      const item = document.createElement('div');
      item.className = 'bot-item' + (i===0?' active':'');
      item.textContent = b.name;
      item.dataset.id = b.id;
      item.addEventListener('click', ()=>{
        document.querySelectorAll('.bot-item').forEach(x=>x.classList.remove('active'));
        item.classList.add('active');
        selectedBotId = b.id;
        document.getElementById('selectedBotLabel').textContent = 'موضوع / ورودی برای: ' + b.name;
      });
      list.appendChild(item);
    });
    if(data.bots.length){ selectedBotId = data.bots[0].id; document.getElementById('selectedBotLabel').textContent = 'موضوع / ورودی برای: ' + data.bots[0].name; }
  }catch(err){
    statusBanner.className = 'err';
    statusBanner.textContent = 'خطا در اتصال به بک‌اند: ' + err.message;
  }
}
loadBots();

document.getElementById('btnGenerate').addEventListener('click', async ()=>{
  const input = document.getElementById('botInput').value.trim();
  const outputBox = document.getElementById('outputBox');
  if(!token){ statusBanner.className='warn'; statusBanner.textContent='اول وارد حساب بشو.'; return; }
  if(!selectedBotId){ return; }
  if(!input){ outputBox.innerHTML = '<span class="output-empty">لطفاً اول یه موضوع بنویس.</span>'; return; }

  const btn = document.getElementById('btnGenerate');
  btn.disabled = true; btn.textContent = 'در حال تولید...';
  outputBox.innerHTML = '<span class="output-empty">در حال ارتباط با هوش مصنوعی...</span>';

  try{
    const res = await fetch(apiBase + '/api/bots/generate', {
      method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+token},
      body: JSON.stringify({ botId: selectedBotId, input })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'خطا در تولید محتوا');
    outputBox.textContent = data.output;
    document.getElementById('btnCopy').style.display = 'inline-block';
  }catch(err){
    outputBox.innerHTML = '<span class="output-empty">خطا: ' + err.message + '</span>';
  }finally{
    btn.disabled = false; btn.textContent = 'تولید محتوای واقعی ✦';
  }
});

document.getElementById('btnCopy').addEventListener('click', ()=>{
  navigator.clipboard.writeText(document.getElementById('outputBox').textContent);
  const b = document.getElementById('btnCopy'); const old = b.textContent;
  b.textContent = 'کپی شد ✓'; setTimeout(()=> b.textContent = old, 1500);
});

/* دکمه‌ی تم روشن/تیره */
document.querySelectorAll('.mode-btn').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.mode-btn').forEach(x=>{ x.classList.remove('active'); x.style.background='transparent'; x.style.color='var(--muted)'; });
    b.classList.add('active'); b.style.background='linear-gradient(135deg,var(--v),var(--p))'; b.style.color='#fff';
    document.body.setAttribute('data-mode', b.dataset.mode);
  });
});
</script>
</body>
</html>
