<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ورود یا ثبت‌نام | جارچیا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Unbounded:wght@600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A16; --ink:#F3F1FB; --muted:#9795B3; --v:#8B7CFF; --p:#FF7CC0; --m:#6FF0C7;
  --line:rgba(255,255,255,.1); --glass:rgba(255,255,255,.05); --danger:#FF6B81;
  --serif:'Vazirmatn',sans-serif; --display:'Unbounded',sans-serif; --mono:'JetBrains Mono',monospace;
}
body[data-mode="light"]{
  --bg:#F4F3FA; --glass:#FFFFFF; --line:#E7E5F3; --ink:#1B1B29; --muted:#6B6C82;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--serif); min-height:100vh;
  display:flex; align-items:center; justify-content:center; padding:24px; position:relative; overflow:hidden;
}
.mesh{position:fixed; inset:-10%; z-index:0;}
.mesh span{position:absolute; border-radius:50%; filter:blur(100px); opacity:.35;}
.mesh span:nth-child(1){width:40vw; height:40vw; top:-10%; right:-8%; background:var(--v);}
.mesh span:nth-child(2){width:34vw; height:34vw; bottom:-12%; left:-6%; background:var(--p);}
.box{position:relative; z-index:1; width:100%; max-width:400px; background:var(--glass); border:1px solid var(--line); border-radius:22px; padding:34px; backdrop-filter:blur(16px);}
.wordmark{font-family:var(--display); font-weight:800; font-size:18px; display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:6px;}
.wordmark .dot{width:8px; height:8px; border-radius:50%; background:linear-gradient(135deg,var(--v),var(--p));}
.box h2{text-align:center; font-size:16px; color:var(--muted); font-weight:500; margin-bottom:26px;}
.tabs{display:flex; background:var(--glass); border:1px solid var(--line); border-radius:12px; padding:4px; margin-bottom:22px;}
.tab{flex:1; text-align:center; padding:9px; border-radius:9px; font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer;}
.tab.active{background:linear-gradient(135deg,var(--v),var(--p)); color:#fff;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; color:var(--muted); font-family:var(--mono); margin-bottom:6px;}
.field input{width:100%; background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:10px; padding:11px 13px; font-size:14px; color:var(--ink);}
.field input:focus{outline:none; border-color:var(--v);}
.hide{display:none;}
.btn{width:100%; border:none; border-radius:11px; padding:13px; font-weight:700; font-size:14.5px; background:linear-gradient(135deg,var(--v),var(--p)); color:#fff; cursor:pointer; margin-top:6px;}
.btn:disabled{opacity:.6; cursor:wait;}
.msg{font-size:13px; padding:11px 13px; border-radius:10px; margin-bottom:14px; display:none;}
.msg.err{background:rgba(255,107,129,.14); color:var(--danger); display:block;}
.msg.ok{background:rgba(111,240,199,.14); color:var(--m); display:block;}
.api-hint{font-size:11px; color:var(--muted); text-align:center; margin-top:18px; line-height:1.8; font-family:var(--mono);}
.api-hint input{width:100%; margin-top:6px; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:7px; padding:6px 9px; font-size:11px; color:var(--muted); direction:ltr; text-align:left;}
</style>
</head>
<body data-mode="dark">
<div class="mesh"><span></span><span></span></div>

<div class="mode-toggle" style="position:fixed; top:20px; left:20px; z-index:2; display:flex; gap:4px; background:var(--glass); border:1px solid var(--line); border-radius:20px; padding:4px;">
  <button class="mode-btn" data-mode="light" style="padding:6px 11px; border:none; background:transparent; border-radius:16px; font-size:13px; color:var(--muted); cursor:pointer;">☀️</button>
  <button class="mode-btn active" data-mode="dark" style="padding:6px 11px; border:none; background:linear-gradient(135deg,var(--v),var(--p)); border-radius:16px; font-size:13px; color:#fff; cursor:pointer;">🌙</button>
</div>

<div class="box">
  <div class="wordmark"><span class="dot"></span>جارچیا</div>
  <h2>ورود یا ساخت حساب کاربری</h2>

  <div class="tabs">
    <div class="tab active" data-t="login">ورود</div>
    <div class="tab" data-t="signup">ثبت‌نام</div>
  </div>

  <div id="msgBox" class="msg"></div>

  <form id="loginForm">
    <div class="field"><label>شماره موبایل</label><input type="text" id="loginPhone" placeholder="09xxxxxxxxx" required /></div>
    <div class="field"><label>رمز عبور</label><input type="password" id="loginPassword" required /></div>
    <button class="btn" type="submit" id="loginBtn">ورود</button>
  </form>

  <form id="signupForm" class="hide">
    <div class="field"><label>نام و نام‌خانوادگی</label><input type="text" id="suName" required /></div>
    <div class="field"><label>شماره موبایل</label><input type="text" id="suPhone" placeholder="09xxxxxxxxx" required /></div>
    <div class="field"><label>رمز عبور (حداقل ۶ کاراکتر)</label><input type="password" id="suPassword" required /></div>
    <button class="btn" type="submit" id="signupBtn">ساخت حساب رایگان</button>
  </form>

  <div class="api-hint">
    آدرس سرور بک‌اند (پس از اجرای npm start):
    <input type="text" id="apiBase" value="https://jarchiya-backend.onrender.com" />
  </div>
</div>

<script>
const msgBox = document.getElementById('msgBox');
function showMsg(text, ok){
  msgBox.textContent = text;
  msgBox.className = 'msg ' + (ok ? 'ok' : 'err');
}
function apiBase(){ return document.getElementById('apiBase').value.replace(/\/$/,''); }

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('loginForm').classList.toggle('hide', t.dataset.t!=='login');
    document.getElementById('signupForm').classList.toggle('hide', t.dataset.t!=='signup');
    msgBox.className = 'msg';
  });
});

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('loginBtn'); btn.disabled = true; btn.textContent='در حال ورود...';
  try{
    const res = await fetch(apiBase()+'/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        phone: document.getElementById('loginPhone').value.trim(),
        password: document.getElementById('loginPassword').value
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'خطا در ورود');
    showMsg('خوش آمدی ' + data.user.name + '! توکن دریافت شد.', true);
    // ذخیره‌ی نشست برای استفاده در داشبورد و بقیه‌ی صفحات
    localStorage.setItem('jarchiya_token', data.token);
    localStorage.setItem('jarchiya_user', JSON.stringify(data.user));
    localStorage.setItem('jarchiya_api_base', apiBase());
    setTimeout(()=>{ window.location.href = '/dashboard'; }, 700);
  }catch(err){
    showMsg(err.message.includes('fetch') ? 'به سرور بک‌اند وصل نشد — مطمئن شو با npm start اجرا شده و آدرسش درسته.' : err.message, false);
  }finally{
    btn.disabled=false; btn.textContent='ورود';
  }
});

document.getElementById('signupForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('signupBtn'); btn.disabled = true; btn.textContent='در حال ساخت حساب...';
  try{
    const res = await fetch(apiBase()+'/api/auth/signup', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        name: document.getElementById('suName').value.trim(),
        phone: document.getElementById('suPhone').value.trim(),
        password: document.getElementById('suPassword').value
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'خطا در ثبت‌نام');
    showMsg('حساب برای ' + data.user.name + ' ساخته شد 🎉', true);
    localStorage.setItem('jarchiya_token', data.token);
    localStorage.setItem('jarchiya_user', JSON.stringify(data.user));
    localStorage.setItem('jarchiya_api_base', apiBase());
    setTimeout(()=>{ window.location.href = '/dashboard'; }, 700);
  }catch(err){
    showMsg(err.message.includes('fetch') ? 'به سرور بک‌اند وصل نشد — مطمئن شو با npm start اجرا شده و آدرسش درسته.' : err.message, false);
  }finally{
    btn.disabled=false; btn.textContent='ساخت حساب رایگان';
  }
});

/* دکمه‌ی تم روشن/تیره */
document.querySelectorAll('.mode-btn').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.mode-btn').forEach(x=>{ x.classList.remove('active'); x.style.background='transparent'; x.style.color='var(--muted)'; });
    b.classList.add('active'); b.style.background='linear-gradient(135deg,var(--v),var(--p))'; b.style.color='#fff';
    document.body.setAttribute('data-mode', b.dataset.mode);
  });
});
</script>
</body>
</html>
